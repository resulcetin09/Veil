name: Compile, test & build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install checksum-verified Compact 0.31.1
        run: npm run setup:compact
      - name: Compile contract and generate proving keys
        run: npm run compile
      - run: npm run typecheck
      - name: Run contract and application tests
        run: npm test -- --reporter=verbose --reporter=junit --outputFile.junit=test-results/unit.xml
      - name: Build application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Development server demo and SDK regression tests
        run: npm run test:e2e:dev
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-results
            playwright-report
          retention-days: 14
